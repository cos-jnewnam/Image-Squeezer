<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Image Squeezer</title>
  <meta name="description" content="Shrink images for the web in your browser. Nothing is uploaded.">
  <meta name="theme-color" content="#0f5e99" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1822" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="shell">
    <header class="head">
      <div class="head-text">
        <h1>Image Squeezer</h1>
        <p>Shrinks images for the web. Everything happens in this browser tab, so nothing is uploaded.</p>
      </div>
      <button id="install" class="btn install" type="button" hidden>Install app</button>
    </header>

    <section id="drop" class="drop" tabindex="0" role="button" aria-label="Choose images to compress">
      <input id="picker" type="file" accept="image/*,.heic,.heif,.avif" multiple hidden>
      <p class="drop-title">Drop up to 5 images here</p>
      <p class="drop-sub">or click to choose files, or paste from your clipboard</p>
    </section>

    <div class="settings">
      <label for="maxw">Max width</label>
      <input id="maxw" type="number" inputmode="numeric" min="100" max="10000" step="50" value="2000">
      <span>px. Smaller images are never enlarged.</span>

      <label for="format">Save as</label>
      <select id="format">
        <option value="auto">Auto</option>
        <option value="jpeg">JPG</option>
        <option value="png">PNG</option>
        <option value="webp">WebP</option>
      </select>
      <span id="format-hint">Auto picks whichever format comes out smallest.</span>
    </div>

    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>

    <ul id="list" class="list" aria-label="Images"></ul>

    <div id="actions" class="actions" hidden>
      <button id="zip" class="btn primary" type="button" disabled>Download all (zip)</button>
      <button id="clear" class="btn" type="button">Clear</button>
      <p id="total" class="total"></p>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
